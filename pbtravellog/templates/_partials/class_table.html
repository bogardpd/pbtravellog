{% import "_macros/icons.html" as icons %}
<table>
  <thead>
    <tr>
      <th>Quality</th>
      <th>Class</th>
      <th>Flights</th>
    </tr>
  </thead>
  <tbody>
    {% for fid, seat_class in classes.items() %}
    <tr>
      <td>
        {{ icons.seat_class_quality(seat_class.get("quality")) }}
      </td>
      <td>
        <a href="{{ url_for('show_class', class_fid=fid) }}">{{ seat_class.get("name") }}</a><br>
        <span class="supplemental">{{ seat_class.get("description") }}</span>
      </td>
      <td>{{ seat_class.get("count") }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
