{% extends "base.html" %}
{% import "_macros/icons.html" as icons %}
{% block title %}Flights{% endblock %}
{% block content %}
<div id="map" class="mapbox-map"></div>
<script>
  const map = new mapboxgl.Map({
    accessToken: '{{ mapbox_api_key }}',
    container: 'map',
    style: 'mapbox://styles/bogardpd/cly0gib62008301p82kk64np1',
    //projection: 'globe',
    zoom: 1,
    center: [-84, 40],
  });

  map.on('style.load', () => {
    map.setFog({});
  });

  map.on('load', () => {
    // Load data.
    map.addSource('flights', {
      'type': 'geojson',
      'data': 'flights.geojson',
      'generateId': true,
    })
    // Add flights.
    map.addLayer({
      'id': 'routes',
      'type': 'line',
      'source': 'flights',
      'filter': ['==', '$type', 'LineString'],
      'paint': {
        'line-width': {
          'property': 'Highlighted',
          'type': 'categorical',
          'stops': [
            [{'zoom':  4, 'value': true },  4.0],
            [{'zoom':  4, 'value': false},  1.5],
            [{'zoom': 20, 'value': true }, 12.0],
            [{'zoom': 20, 'value': false},  5.0],
          ],
        },
        'line-color': '#0077bb',
        'line-opacity': ['case', ['get', 'Highlighted'], 1.0, 0.8],
      }
    });
    // Add airports.
    map.addLayer({
      'id': 'airports',
      'type': 'circle',
      'source': 'flights',
      'filter': ['==', '$type', 'Point'],
      'paint': {
        'circle-radius': {
          'property': 'Highlighted',
          'type': 'categorical',
          'stops': [
            [{'zoom':  4, 'value': true }, 4],
            [{'zoom':  4, 'value': false}, 3],
            [{'zoom': 20, 'value': true }, 24],
            [{'zoom': 20, 'value': false}, 12],
          ],
        },
        'circle-color': '#000000',
        'circle-stroke-color': '#0077bb',
        'circle-stroke-width': 1,
      }
    });
    // Add labels.
    map.addLayer({
      'id': 'airport-labels',
      'type': 'symbol',
      'source': 'flights',
      'filter': ['==', '$type', 'Point'],
      'minzoom': 3,
      'layout': {
        'text-field': ['get', 'airport_code'],
        'text-variable-anchor': ['bottom','top','left','right'],
        'text-radial-offset': 0.5,
        'text-font': [
          'case',
          ['get', 'Highlighted'],
          ['literal', ['DIN Pro Bold', 'Arial Unicode MS Bold']],
          ['literal', ['DIN Pro Regular', 'Arial Unicode MS Regular']],
        ],
        'text-size': ['case', ['get', 'Highlighted'], 15, 13],
        'symbol-sort-key': ['case', ['get', 'Highlighted'], 0, 1], // Lower value is higher priority
      },
      'paint': {
        'text-color': '#000000',
        'text-halo-color': '#ffffff',
        'text-halo-width': 1.5,
        'text-halo-blur': 2,
      },
    });
  });
</script>
{% include "_partials/flight_table.html" %}
{% endblock content %}
