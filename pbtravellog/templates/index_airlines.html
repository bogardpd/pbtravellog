{% extends "base.html" %}
{% import "icons.html" as icons %}
{% block title %}Airlines{% endblock %}
{% block content %}
<table>
  <thead>
    <th>Airline</th>
    <th class="iata-code">IATA</th>
  </thead>
  <tbody>
    {% for airline in airlines %}
    <tr>
      <td>{{ icons.airline(airline.fid) }} {{ airline.name }}</td>
      <td class="iata-code"><span class="code">{{ airline.iata_code }}</span></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock content %}
