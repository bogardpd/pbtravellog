{% extends "base.html" %}
{% block title %}Airports{% endblock %}
{% block content %}
<table>
  <thead>
    <th>Airport</th>
    <th>Code</th>
  </thead>
  <tbody>
    {% for airport in airports %}
    <tr>
      <td>{{ airport.name }}</td>
      <td><span class="code">{{ airport.code }}</span></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock content %}
