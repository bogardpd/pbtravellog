<table>
  <thead>
    <th class="rank">#</th>
    <th>Family</th>
    <th class="count">Flights</th>
  </thead>
  <tbody>
    {% for family in aircraft_families %}
    <tr>
      <td class="rank">{% if loop.first or family.rank != loop.previtem.rank %}{{ family.rank }}{% else %}⋮{% endif %}</td>
      <td><a href="/aircraft/{{ family.slug }}.html">{{ family.name }}</a></td>
      <td class="count">{{ family.count }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
