{% import "macros/icons.html" as icons %}
<table>
  <thead>
    <tr>
      <th class="rank">#</th>
      <th>Flight</th>
      <th class="flight-route">Route</th>
      <th>Departure UTC</th>
    </tr>
  </thead>
  <tbody>
    {% for flight in flights %}
    <tr{% if not loop.last and flight.trip_fid == loop.nextitem.trip_fid and flight.trip_section == loop.nextitem.trip_section %} class="continue"{% endif %}>
      <td class="rank">{{ loop.index }}</td>
      <td>{{ icons.airline(flight.airline_fid) }} {{ flight.name }}</td>
      <td class="flight-route"><span class="code">{{ flight.origin_airport_code }}</span> &rarr; <span class="code">{{ flight.destination_airport_code }}</span></td>
      <td>{{ flight.departure_utc | format_utc }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
