[project]
name = "pbtravellog"
version = "0.0.1"
description = "Tools for maintaining travel logs"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "simplekml>=1.3.6",
]
[project.scripts]
pbtravellog = "pbtravellog.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"