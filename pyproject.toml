[project]
name = "pbtravellog"
version = "0.4.0"
description = "Tools for maintaining travel logs"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "flask>=3.1.3",
    "geopandas>=1.1.2",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "pyproj>=3.7.0",
    "python-dateutil>=2.8.0",
    "requests>=2.32.0",
    "shapely>=2.1.0",
    "simplekml>=1.3.6",
    "tabulate>=0.9.0",
]
[project.scripts]
pbtravellog = "pbtravellog.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"